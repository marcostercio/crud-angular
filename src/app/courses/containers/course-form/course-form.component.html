<mat-card class="example-card" appearance="outlined">
  <mat-toolbar color="primary">
      Detalhes do Curso
  </mat-toolbar>
  <mat-card-content>
    <form [formGroup]="form" class="min-width">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Nome</mat-label>
        <input matInput placeholder="Nome" formControlName="name" #name >
        <mat-hint align="end">{{name.value?.length || 0}}/100</mat-hint>
        @if (form.get('name')?.invalid) {
      <mat-error>{{errorMessage("name")}}</mat-error>
      }
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Categoria</mat-label>
        <mat-select formControlName="category">
          <mat-option value="null"></mat-option>
          <mat-option value="Front-end">Front-End</mat-option>
          <mat-option value="Back-end">Back-End</mat-option>

        </mat-select>
          @if (form.get('category')?.invalid) {
          <mat-error>{{errorMessage("category")}}</mat-error>
          }
      </mat-form-field>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <button matButton="elevated" color="primary" (click) = "onSubmit()">Salvar</button>
    <button matButton="elevated" (click)="onCancel()">Cancelar</button>
  </mat-card-actions>

</mat-card>
