  <mat-table [dataSource]="courses" class="mat-shadow-2">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <mat-header-cell *matHeaderCellDef> Curso </mat-header-cell>
          <mat-cell *matCellDef="let course"> {{ course.name }} </mat-cell>
        </ng-container>
        <!-- Categoria Column -->
        <ng-container matColumnDef="category">
          <mat-header-cell *matHeaderCellDef> Categoria </mat-header-cell>
          <mat-cell *matCellDef="let course"> {{ course.category }}
            <mat-icon aria-hidden="false" aria-label="Categoria do Curso" >{{ course.category | category }}</mat-icon>
          </mat-cell>
        </ng-container>

                <!-- Actions Column -->
        <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef class="action-header">
           <button matMiniFab aria-label="Adicionar um curso" >
              <mat-icon (click)="onAdd()">add</mat-icon>
           </button>
        </mat-header-cell>
        <mat-cell *matCellDef="let course" class="action-column">
            <button matIconButton  color="primary" aria-label="Editar curso">
               <mat-icon (click)="onEdit(course)">edit</mat-icon>
            </button>

            <button matIconButton color="warn" aria-label="Remover curso">
                 <mat-icon (click)="onDelete(course)">delete</mat-icon>
            </button>
        </mat-cell>

        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
      </mat-table>
